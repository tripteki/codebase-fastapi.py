<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">
    <title>{{ app_name }}</title>
    <style>
        @media (max-width: 600px) {
            .mail-outer { padding: 12px 8px !important; }
            .mail-card { border-radius: 10px !important; }
            .mail-header { padding: 12px 14px !important; }
            .mail-body { padding: 14px 14px 12px !important; }
            .mail-btn { display: block !important; width: 100% !important; min-width: 100% !important; box-sizing: border-box !important; }
            .mail-info-value { display: block !important; text-align: left !important; padding-top: 4px !important; }
        }
    </style>
</head>
<body style="margin:0;padding:0;background:#111827;color:#f3f4f6;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#111827;">
        <tr>
            <td class="mail-outer" align="center" style="padding:20px 12px;">
                <table role="presentation" class="mail-card" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#1f2937;border:1px solid #374151;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,0.45);overflow:hidden;">
                    <tr>
                        <td class="mail-header" style="padding:14px 18px;background:{{ primary_color }};color:#ffffff;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td valign="middle" align="left" style="width:32px;">
                                        {% if logo_url %}
                                        <img src="{{ logo_url }}" alt="{{ app_name }}" height="32" width="32" style="display:block;height:32px;width:32px;object-fit:contain;border:0;outline:none;text-decoration:none;">
                                        {% else %}
                                        <span style="color:#ffffff;font-size:18px;line-height:24px;font-weight:700;letter-spacing:0.02em;">{{ app_name }}</span>
                                        {% endif %}
                                    </td>
                                    {% if header_badge %}
                                    <td valign="middle" align="right" style="padding-left:10px;">
                                        <span style="display:inline-block;max-width:58%;padding:4px 9px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.28);border-radius:999px;color:#ffffff;font-size:10px;font-weight:700;letter-spacing:0.03em;line-height:1.2;text-align:right;white-space:nowrap;">{{ header_badge }}</span>
                                    </td>
                                    {% endif %}
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td class="mail-body" style="padding:18px 18px 14px;background:#1f2937;color:#f3f4f6;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:12px 18px 14px;text-align:center;background:#111827;border-top:1px solid #374151;color:#9ca3af;font-size:11px;letter-spacing:0.01em;">
                            &copy; {{ year }} {{ app_name }}. {{ mail_rights }}
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
