{% extends "user/auth/mail.html" %}

{% block content %}
<p style="margin:0 0 6px;font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-0.02em;color:#f9fafb;">{{ title|default(verify) }}</p>
<p style="margin:0 0 12px;font-size:15px;font-weight:700;line-height:1.55;color:#f3f4f6;">{{ start_greeting }}</p>
<p style="margin:0 0 12px;color:#d1d5db;font-size:14px;line-height:1.55;">{{ line1 }}</p>
<p style="margin:0 0 12px;color:#9ca3af;font-size:12px;line-height:1.5;">{{ line2 }}</p>
{% include "user/auth/_user_panel.html" %}
<table role="presentation" class="mail-cta" width="100%" cellpadding="0" cellspacing="0" align="center" style="margin:12px 0 10px;">
    <tr>
        <td align="center">
            <a class="mail-btn" href="{{ link }}" style="display:inline-block;min-width:180px;border-radius:8px;padding:11px 22px;font-size:13px;font-weight:700;letter-spacing:0.01em;text-align:center;color:#ffffff;background:{{ primary_color }};text-decoration:none;">{{ verify }}</a>
        </td>
    </tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:12px;border-top:1px solid #374151;">
    <tr>
        <td style="padding-top:18px;">
            <p style="margin:0 0 4px;color:#9ca3af;font-size:12px;line-height:1.5;">{{ mail_thanks }}</p>
            <p style="margin:0;font-size:15px;font-weight:700;letter-spacing:0.08em;color:#f9fafb;">{{ app_name }}</p>
        </td>
    </tr>
</table>
{% endblock %}
