{% if user_name or user_email %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 12px;border:1px solid #4b5563;border-radius:10px;background:#1f2937;border-collapse:separate;">
    <tr>
        <td style="padding:10px 14px;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9ca3af;border-bottom:1px solid #4b5563;background:#111827;">{{ mail_user_information }}</td>
    </tr>
    {% if user_name %}
    <tr>
        <td style="padding:8px 14px;{% if user_email %}border-bottom:1px solid #374151;{% endif %}">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                    <td style="font-size:12px;font-weight:600;color:#9ca3af;white-space:nowrap;">{{ mail_full_name }}</td>
                    <td class="mail-info-value" align="right" style="font-size:13px;font-weight:600;color:#f9fafb;text-align:right;">{{ user_name }}</td>
                </tr>
            </table>
        </td>
    </tr>
    {% endif %}
    {% if user_email %}
    <tr>
        <td style="padding:8px 14px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                    <td style="font-size:12px;font-weight:600;color:#9ca3af;white-space:nowrap;">{{ mail_email_address }}</td>
                    <td class="mail-info-value" align="right" style="text-align:right;">
                        <span style="display:inline-block;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;background:#111827;color:#e5e7eb;border:1px solid #4b5563;">{{ user_email }}</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    {% endif %}
</table>
{% endif %}
